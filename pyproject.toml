[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "suffix-hybrid"
version = "0.2.0"
description = "Rust-native bounded suffix-cache and n-gram vLLM proposer"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
authors = [{ name = "flozi00" }]

[tool.maturin]
python-source = "."
module-name = "suffix_hybrid._native"
features = ["pyo3/extension-module"]
include = [{ path = "sitecustomize.py", format = "wheel" }]
