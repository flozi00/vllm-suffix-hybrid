[package]
name = "suffix-hybrid-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
numpy = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
