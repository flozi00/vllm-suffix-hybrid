name: Native plugin
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'graphify-out/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  # K-GDN1 (cargo feature qwen-gdn-kernels): cuda-bindings needs only CUDA 13
  # HEADERS at build time (driver API is dlopen'd at runtime) — taken from
  # NVIDIA pip wheels, no toolkit install. `tileiras` (Tile IR -> cubin) is an
  # offline compiler (no GPU, no driver), also from pip. Pods stay driver-only
  # and never JIT: the cubins ship in the bundle (suffix_hybrid/qgdn_cubins/).
  CUDA_WHEEL_VERSION: '13.4.92'
  CURAND_WHEEL_VERSION: '10.4.4.72'
  # Must be a bytecode version whose opcode set covers what cutile 0.3.1 emits:
  # 13.2 rejects opcode 112 ('unsupported opcode 112 for bytecode version 13.2',
  # d057d457 CI, both K-GDN1 and K2). cutile 0.3.1 clamps to 13.3 at most
  # (asked for 13.4 it serialized 13.3, dff7803a CI), so pin its maximum.
  CUTILE_BYTECODE_VERSION: '13.3'
  # cuda-oxide kernel track (docs/oxide-kernels.md) — THE shipping path for
  # our kernels since 2026-09-25: pods run driver 580 (CUDA 13.0) with no
  # PTX JIT library, so every shipped kernel is sm_120 SASS from ptxas 13.0.
  OXIDE_NIGHTLY: nightly-2026-08-28
  CUDA_OXIDE_REV: ec4aa4797956534578a1af010f86252a0b6d8626
  PTXAS_WHEEL_VERSION: '13.0.88'
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CUDA 13 headers + offline tileiras (pip wheels, no GPU)
        run: |
          python -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux_2_27_x86_64 --python-version 3.11 \
            nvidia-cuda-runtime==$CUDA_WHEEL_VERSION nvidia-cuda-crt==$CUDA_WHEEL_VERSION \
            nvidia-curand==$CURAND_WHEEL_VERSION nvidia-cuda-tileiras==$CUDA_WHEEL_VERSION \
            nvidia-cuda-cuobjdump==$CUDA_WHEEL_VERSION \
            nvidia-cuda-nvcc==$CUDA_WHEEL_VERSION nvidia-nvvm==$CUDA_WHEEL_VERSION \
            nvidia-nvjitlink==$CUDA_WHEEL_VERSION -d .cuda13-whl
          for w in .cuda13-whl/*.whl; do python -m zipfile -e "$w" .cuda13; done
          test -f .cuda13/nvidia/cu13/include/cuda.h
          chmod +x .cuda13/nvidia/cu13/bin/*
          .cuda13/nvidia/cu13/bin/tileiras --version
          echo "CUDA_TOOLKIT_PATH=$PWD/.cuda13/nvidia/cu13" >> "$GITHUB_ENV"
          echo "CUTILE_TILEIRAS_PATH=$PWD/.cuda13/nvidia/cu13/bin/tileiras" >> "$GITHUB_ENV"
          # tileiras' declared deps (Requires-Dist: nvidia-cuda-nvcc, nvidia-nvvm,
          # nvidia-nvjitlink): without ptxas/libnvvm/libnvJitLink it prints only
          # "failed to compile Tile IR program" (exit 5) for ANY input.
          test -x .cuda13/nvidia/cu13/bin/ptxas && test -f .cuda13/nvidia/cu13/lib/libnvvm.so.4
          echo "$PWD/.cuda13/nvidia/cu13/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/.cuda13/nvidia/cu13/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Rust tests (default, oxide host, qwen-gdn Tile IR lowering, retired cutile builds)
        run: |
          sudo apt-get install -y libclang-dev
          cargo test --release
          cargo test --release --features oxide-kernels,qwen-gdn-kernels
          cargo check --release --features cutile-kernels
          cargo check --release --features nvfp4-attn-kernels
      - name: cuda-oxide toolchain (pinned nightly + its llc/NVPTX) + ptxas 13.0
        run: |
          rustup toolchain install "$OXIDE_NIGHTLY" --profile minimal -c rust-src,rustc-dev,llvm-tools
          # The real tool (NOT the unrelated crates.io `cuda-oxide` crate).
          cargo +"$OXIDE_NIGHTLY" install --locked --git https://github.com/NVlabs/cuda-oxide.git \
            --rev "$CUDA_OXIDE_REV" cargo-oxide
          llc="$(rustc +"$OXIDE_NIGHTLY" --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llc"
          "$llc" --version | grep -q nvptx64
          echo "CUDA_OXIDE_LLC=$llc" >> "$GITHUB_ENV"
          python -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux_2_27_x86_64 --python-version 3.11 \
            nvidia-cuda-nvcc==$PTXAS_WHEEL_VERSION -d .cuda130-whl
          for w in .cuda130-whl/*.whl; do python -m zipfile -e "$w" .cuda130; done
          ptxas=$(find .cuda130 -name ptxas -type f | head -1); chmod +x "$ptxas"
          "$ptxas" --version | tee /dev/stderr | grep -q "release 13.0"
          echo "OXIDE_PTXAS=$PWD/$ptxas" >> "$GITHUB_ENV"
          echo "OXIDE_CUOBJDUMP=$(find $PWD/.cuda13 -name cuobjdump -type f | head -1)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: '2_28'
          args: --release --locked --features oxide-kernels --out dist
          before-script-linux: dnf install -y clang-devel || yum install -y clang-devel
          docker-options: -e CUDA_TOOLKIT_PATH=${{ github.workspace }}/.cuda13/nvidia/cu13
      - name: Exercise installed Linux wheel
        run: |
          python -m pip install dist/*.whl numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Leave the checkout first: its source suffix_hybrid/ (no built .so)
          # would shadow the installed wheel.
          cd "$RUNNER_TEMP"
          so=$(python -c "import suffix_hybrid._native as n; print(n.__file__)")
          if readelf -d "$so" | grep -Ei 'NEEDED.*(libcuda|libcudart|libcurand)'; then exit 1; fi
          python -c "import suffix_hybrid._native as n; assert n.HAS_QWEN_GDN_CUDA and n.HAS_NVFP4_ATTN_CUDA and n.HAS_OXIDE_KERNELS"
          python -m pytest "$GITHUB_WORKSPACE/tests" "$GITHUB_WORKSPACE/sm120/tests" -q --import-mode=importlib
      - name: Prebuild K-GDN1 cubins for sm_120 (offline tileiras) + resource report
        # K-GDN1 is default-OFF and fails closed without its cubins
        # (SUFFIX_QWEN_GDN=1), so a tileiras failure must not block shipping
        # the rest of the bundle. The step stays visibly red; the bundle
        # simply omits qgdn_cubins/. CUTILE_DUMP puts the Tile IR in the log.
        continue-on-error: true
        env:
          CUTILE_DUMP: ir,bytecode
        run: |
          python scripts/qwen_gdn_prebuild.py --out qgdn_cubins || { rm -rf qgdn_cubins; exit 1; }
          obj=$(find .cuda13 -name cuobjdump -type f | head -1); chmod +x "$obj"
          for c in qgdn_cubins/*_act0_t1_s16.cubin qgdn_cubins/*_act0_t16_s16.cubin; do
            "$obj" --dump-resource-usage "$c"
          done
      - name: Build cuda-oxide kernels -> sm_120 cubins (ptxas 13.0) + SASS/ISA assertions
        # kernels-oxide/<name>/ -> PTX (ISA <= 9.0) -> ptxas 13.0 -> cubin;
        # asserts sm_120 SASS (cuobjdump --list-elf) and ptxas release 13.0.
        # Default-OFF lanes fail closed without their cubins, and the boot
        # probe (SUFFIX_OXIDE_PROBE=1) reports OXIDE-PROBE FAIL: never block
        # the rest of the bundle, stay visibly red.
        continue-on-error: true
        run: |
          python scripts/oxide_build.py --out oxide_cubins || { rm -rf oxide_cubins; exit 1; }
      - name: Create directly mountable runtime bundle
        run: |
          python scripts/runtime_bundle.py --wheel dist/*.whl --output runtime --revision "$GITHUB_SHA" \
            $( [ -f qgdn_cubins/manifest.json ] && echo --qgdn-cubins qgdn_cubins ) \
            $( [ -f oxide_cubins/manifest.json ] && echo --oxide-cubins oxide_cubins )
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-x86_64
          path: runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist/*.whl
