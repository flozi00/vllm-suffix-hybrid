# K-GDN1 (qwen3.8-27b fused GDN decode kernel) feature build — manual only.
# Separate from native.yml so the default wheel stays exactly as before.
# UNTESTED in CI as of 2026-09-24 (authored on a GPU-less Mac where the same
# header-only recipe builds + lowers the kernel to Tile IR bytecode).
# cuda-bindings only needs CUDA 13.x HEADERS at build time (driver API is
# dlopen'd at runtime), so we take cuda.h/curand.h from NVIDIA's pip wheels
# instead of installing a 3-4 GB toolkit. Pods stay driver-only.
name: qwen-gdn kernel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CUDA 13 headers (pip wheels, headers only)
        run: |
          python -m pip download --no-deps --only-binary=:all: \
            --platform manylinux2014_x86_64 --platform manylinux_2_27_x86_64 \
            nvidia-cuda-runtime==13.4.92 nvidia-cuda-crt==13.4.92 nvidia-curand==10.4.4.72 -d .cuda13-whl
          for w in .cuda13-whl/*.whl; do python -m zipfile -e "$w" .cuda13; done
          test -f .cuda13/nvidia/cu13/include/cuda.h
      - name: Tile IR compile-only gate (kernel -> bytecode for sm_120, no GPU)
        env:
          CUDA_TOOLKIT_PATH: ${{ github.workspace }}/.cuda13/nvidia/cu13
          CUTILE_BYTECODE_VERSION: '13.2'
        run: |
          sudo apt-get install -y libclang-dev
          cargo test --release --features qwen-gdn-kernels qwen_gdn
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: '2_28'
          args: --release --locked --features qwen-gdn-kernels --out dist
          before-script-linux: dnf install -y clang-devel || yum install -y clang-devel
          docker-options: -e CUDA_TOOLKIT_PATH=${{ github.workspace }}/.cuda13/nvidia/cu13
      - name: Exercise wheel (CPU; GPU test skips) + no CUDA SONAME linked
        run: |
          python -m pip install dist/*.whl numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          so=$(python -c "import suffix_hybrid._native as n; print(n.__file__)")
          ! readelf -d "$so" | grep -Ei 'NEEDED.*(libcuda|libcudart|libcurand)'
          python -c "import suffix_hybrid._native as n; assert n.HAS_QWEN_GDN_CUDA"
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" "$GITHUB_WORKSPACE/sm120/tests" -q --import-mode=importlib
      - name: Runtime bundle
        run: python scripts/runtime_bundle.py --wheel dist/*.whl --output runtime --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-x86_64-qwen-gdn
          path: runtime/
          if-no-files-found: error
